[workspace]
members = [
  "apps/desktop/src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
authors = ["Codembly Contributors"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
wasm-bindgen = "0.2"
tauri = { version = "2.11.2" }

[profile.dev]
opt-level = 0
incremental = true

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
opt-level = 3
incremental = false

[profile.release.package."*"]
opt-level = 2
